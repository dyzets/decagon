name: Release

# Builds installers for Windows, macOS and Linux and attaches them to a GitHub
# Release whenever you push a version tag (e.g. v0.1.0). electron-builder publishes
# the artifacts to a *draft* release of the same version, which you then publish.

on:
  push:
    tags:
      - "v*"

# Needed so the built-in GITHUB_TOKEN can create/update the release.
permissions:
  contents: write

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    env:
      # Fixed cache dir so @electron/get reuses the downloaded binary across runs.
      ELECTRON_CACHE: ${{ github.workspace }}/.cache/electron
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Cache Electron binary
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.cache/electron
          key: ${{ runner.os }}-electron-${{ hashFiles('package-lock.json') }}
          restore-keys: ${{ runner.os }}-electron-

      # `npm ci` downloads the Electron binary in a postinstall step; that download
      # occasionally fails with a transient 504/timeout. Retry instead of failing the run.
      - name: Install dependencies
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 15
          max_attempts: 3
          retry_wait_seconds: 30
          command: npm ci

      - name: Bundle main + preload + renderer
        run: npm run build

      - name: Package & publish to the GitHub Release
        run: npx --no-install electron-builder --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Skip macOS code-signing (unsigned .dmg). Remove if you add signing certs.
          CSC_IDENTITY_AUTO_DISCOVERY: false
